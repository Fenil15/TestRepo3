<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <meta name="theme-color" content="#0000FF">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    </script>
</head>
<body>
    <nav class="tab-bar" role="tablist">
        <a href="index.html" role="tab" aria-current="page">Home</a>
        <a href="about.html" role="tab">About</a>
        <a href="faq.html" role="tab">FAQ</a>
        <a href="settings.html" role="tab">Settings</a>
        <a href="legal.html" role="tab">Legal</a>

    <h1>Hello, World!</h1>
    <a href="about.html">About Us</a>
    <a href="faq.html">FAQ</a>
    <a href="settings.html">Settings</a>
    <a href="legal.html">Legal</a>
    <a href="privacy.html">Privacy Policy</a>
   
    <script defer src="tabbar.js"></script>
    <div id="greeting"></div>
    <script>
        async function fetchGreeting() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('greeting').textContent = 'HELLO ' + data.name;
                } else {
                    console.error('Failed to fetch greeting:', response.status);
                }
            } catch (error) {
                console.error('Error fetching greeting:', error);
            }
        }
        fetchGreeting();
    </script>
</body>
</html>
